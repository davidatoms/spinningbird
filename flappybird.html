<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
    }
    canvas {
      display: block;
      border: 3px solid #333;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  canvas.width = 360;
  canvas.height = 640;

  // --- Constants ---
  const GRAVITY = 0.45;
  const JUMP = -8.5;
  const PIPE_WIDTH = 60;
  const PIPE_GAP = 160;
  const PIPE_SPEED = 2.5;
  const PIPE_INTERVAL = 90; // frames
  const GROUND_HEIGHT = 80;
  const SKY_HEIGHT = canvas.height - GROUND_HEIGHT;

  // --- State ---
  let state = 'idle'; // idle | playing | dead
  let score = 0;
  let best = 0;
  let frame = 0;

  // Bird
  const bird = {
    x: 80,
    y: canvas.height / 2 - 20,
    vy: 0,
    w: 34,
    h: 24,
    angle: 0,
    wingPhase: 0,
    reset() {
      this.y = canvas.height / 2 - 20;
      this.vy = 0;
      this.angle = 0;
      this.wingPhase = 0;
    },
    jump() {
      this.vy = JUMP;
    },
    update() {
      if (state === 'playing') {
        this.vy += GRAVITY;
        this.y += this.vy;
        this.angle = Math.min(Math.PI / 2, Math.max(-0.4, this.vy * 0.07));
      } else if (state === 'idle') {
        this.y = canvas.height / 2 - 20 + Math.sin(frame * 0.05) * 8;
      }
      this.wingPhase += 0.35;
    },
    hitbox() {
      return { x: this.x - this.w / 2 + 5, y: this.y - this.h / 2 + 4, w: this.w - 10, h: this.h - 8 };
    },
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      const wing = Math.sin(this.wingPhase) * 6;

      // Body
      ctx.fillStyle = '#f9ca24';
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e55039';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#f0932b';
      ctx.beginPath();
      ctx.ellipse(-4, wing, 10, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Eye white
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(8, -5, 7, 0, Math.PI * 2);
      ctx.fill();

      // Pupil
      ctx.fillStyle = '#130f40';
      ctx.beginPath();
      ctx.arc(10, -4, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#e55039';
      ctx.beginPath();
      ctx.moveTo(14, -1);
      ctx.lineTo(22, 2);
      ctx.lineTo(14, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }
  };

  // Pipes
  let pipes = [];

  function spawnPipe() {
    const minTop = 80;
    const maxTop = SKY_HEIGHT - PIPE_GAP - 80;
    const topH = Math.random() * (maxTop - minTop) + minTop;
    pipes.push({ x: canvas.width, topH, scored: false });
  }

  function updatePipes() {
    if (frame % PIPE_INTERVAL === 0) spawnPipe();
    pipes.forEach(p => p.x -= PIPE_SPEED);
    pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
  }

  // Background clouds
  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 90 + 30,
    y: 40 + Math.random() * 100,
    r: 20 + Math.random() * 20,
    speed: 0.3 + Math.random() * 0.3
  }));

  function updateClouds() {
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.r * 2 < 0) c.x = canvas.width + c.r;
    });
  }

  // Ground scroll
  let groundX = 0;

  // --- Collision ---
  function checkCollision() {
    const hb = bird.hitbox();
    // Ground / ceiling
    if (bird.y + bird.h / 2 >= SKY_HEIGHT || bird.y - bird.h / 2 <= 0) return true;
    // Pipes
    for (const p of pipes) {
      if (
        hb.x < p.x + PIPE_WIDTH &&
        hb.x + hb.w > p.x
      ) {
        if (hb.y < p.topH || hb.y + hb.h > p.topH + PIPE_GAP) return true;
      }
    }
    return false;
  }

  // --- Draw helpers ---
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, SKY_HEIGHT);
    grad.addColorStop(0, '#74b9ff');
    grad.addColorStop(1, '#a29bfe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, SKY_HEIGHT);
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.arc(c.x + c.r * 0.7, c.y - c.r * 0.4, c.r * 0.75, 0, Math.PI * 2);
      ctx.arc(c.x + c.r * 1.4, c.y, c.r * 0.85, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawPipe(p) {
    const capH = 18;
    const capW = PIPE_WIDTH + 10;

    // Top pipe
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topH - capH);
    // Top cap
    ctx.fillStyle = '#00cec9';
    ctx.fillRect(p.x - 5, p.topH - capH, capW, capH);
    // Shading
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, 0, 10, p.topH - capH);

    // Bottom pipe
    const botY = p.topH + PIPE_GAP;
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, botY + capH, PIPE_WIDTH, SKY_HEIGHT - botY - capH);
    // Bottom cap
    ctx.fillStyle = '#00cec9';
    ctx.fillRect(p.x - 5, botY, capW, capH);
    // Shading
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, botY + capH, 10, SKY_HEIGHT - botY - capH);
  }

  function drawGround() {
    groundX -= PIPE_SPEED;
    if (groundX <= -20) groundX = 0;

    // Dirt
    const grad = ctx.createLinearGradient(0, SKY_HEIGHT, 0, canvas.height);
    grad.addColorStop(0, '#fdcb6e');
    grad.addColorStop(1, '#e17055');
    ctx.fillStyle = grad;
    ctx.fillRect(0, SKY_HEIGHT, canvas.width, GROUND_HEIGHT);

    // Grass strip
    ctx.fillStyle = '#55efc4';
    ctx.fillRect(0, SKY_HEIGHT, canvas.width, 14);

    // Grass tufts
    ctx.fillStyle = '#00b894';
    for (let gx = groundX; gx < canvas.width; gx += 20) {
      ctx.fillRect(gx, SKY_HEIGHT, 12, 7);
    }
  }

  function drawScore() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 4;
    ctx.font = 'bold 42px Arial';
    ctx.strokeText(score, canvas.width / 2, 70);
    ctx.fillText(score, canvas.width / 2, 70);
  }

  function drawOverlay() {
    // Semi-transparent panel
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 130, canvas.height / 2 - 140, 260, 280, 16);
    ctx.fill();

    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = '#fdcb6e';
      ctx.font = 'bold 38px Arial';
      ctx.fillText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 70);
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillText('to start!', canvas.width / 2, canvas.height / 2 + 10);
    } else if (state === 'dead') {
      ctx.fillStyle = '#e17055';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 80);

      ctx.fillStyle = '#fff';
      ctx.font = '22px Arial';
      ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = '#fdcb6e';
      ctx.fillText('Best: ' + best, canvas.width / 2, canvas.height / 2 + 10);

      ctx.fillStyle = '#dfe6e9';
      ctx.font = '18px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 + 60);
      ctx.fillText('to play again', canvas.width / 2, canvas.height / 2 + 85);
    }
  }

  // --- Input ---
  function handleInput() {
    if (state === 'idle') {
      state = 'playing';
      frame = 0;
    } else if (state === 'playing') {
      bird.jump();
    } else if (state === 'dead') {
      reset();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
  });
  canvas.addEventListener('click', handleInput);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });

  // --- Reset ---
  function reset() {
    bird.reset();
    pipes = [];
    score = 0;
    frame = 0;
    state = 'playing';
  }

  // --- Main loop ---
  function loop() {
    // Update
    frame++;
    bird.update();
    updateClouds();

    if (state === 'playing') {
      updatePipes();

      // Score
      pipes.forEach(p => {
        if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
          p.scored = true;
          score++;
          if (score > best) best = score;
        }
      });

      if (checkCollision()) {
        state = 'dead';
      }
    }

    // Draw
    drawSky();
    drawClouds();
    pipes.forEach(drawPipe);
    drawGround();
    bird.draw();

    if (state === 'playing') drawScore();
    if (state !== 'playing') drawOverlay();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
