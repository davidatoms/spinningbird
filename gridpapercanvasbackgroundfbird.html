<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Paper Canvas Background Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
    }
    canvas {
      display: block;
      border: 3px solid #333;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  canvas.width = 360;
  canvas.height = 640;

  const GRAVITY = 0.45;
  const JUMP = -8.5;
  const PIPE_WIDTH = 60;
  const PIPE_GAP = 160;
  const PIPE_SPEED = 2.5;
  const PIPE_INTERVAL = 90;
  const GROUND_HEIGHT = 80;
  const SKY_HEIGHT = canvas.height - GROUND_HEIGHT;

  const SIZE = 28; // square side length

  let state = 'idle';
  let paused = false;
  let score = 0;
  let best = 0;
  let frame = 0;
  let flapDots = []; // { x, y, n }
  let flapCount = 0;
  let velocityGhosts = []; // ghost type B: launched on flap, moves by velocity only (no gravity)
  let fallingGhosts = [];  // ghost type C: spawns on flap, falls with gravity only (no upward velocity)

  const bird = {
    x: 80,
    y: canvas.height / 2 - 20,
    vy: 0,
    angle: 0,
    reset() {
      this.y = canvas.height / 2 - 20;
      this.vy = 0;
      this.angle = 0;
    },
    jump() {
      this.vy = JUMP;
    },
    update() {
      if (state === 'playing') {
        this.vy += GRAVITY;
        this.y += this.vy;
        this.angle = Math.min(Math.PI / 2, Math.max(-0.4, this.vy * 0.07));
      } else if (state === 'idle') {
        this.y = canvas.height / 2 - 20 + Math.sin(frame * 0.05) * 8;
      }
    },
    hitbox() {
      const h = SIZE * 0.8;
      return { x: this.x - h / 2, y: this.y - h / 2, w: h, h };
    },
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      const s = SIZE;
      const h = s / 2;

      // Plain yellow square
      ctx.fillStyle = '#f9ca24';
      ctx.fillRect(-h, -h, s, s);

      // Center dot
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  };

  let pipes = [];

  function spawnPipe() {
    const minTop = 80;
    const maxTop = SKY_HEIGHT - PIPE_GAP - 80;
    const topH = Math.random() * (maxTop - minTop) + minTop;
    pipes.push({ x: canvas.width, topH, scored: false });
  }

  function updatePipes() {
    if (frame % PIPE_INTERVAL === 0) spawnPipe();
    pipes.forEach(p => p.x -= PIPE_SPEED);
    pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
  }

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 90 + 30,
    y: 40 + Math.random() * 100,
    r: 20 + Math.random() * 20,
    speed: 0.3 + Math.random() * 0.3
  }));

  function updateClouds() {
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.r * 2 < 0) c.x = canvas.width + c.r;
    });
  }

  let groundX = 0;

  function checkCollision() {
    const hb = bird.hitbox();
    if (bird.y + SIZE / 2 >= SKY_HEIGHT || bird.y - SIZE / 2 <= 0) return true;
    for (const p of pipes) {
      if (hb.x < p.x + PIPE_WIDTH && hb.x + hb.w > p.x) {
        if (hb.y < p.topH || hb.y + hb.h > p.topH + PIPE_GAP) return true;
      }
    }
    return false;
  }

  const CELL = 20; // grid cell size in px

  function drawSky() {
    // Paper background
    ctx.fillStyle = '#fafaf7';
    ctx.fillRect(0, 0, canvas.width, SKY_HEIGHT);

    // Minor grid lines — every CELL px
    ctx.beginPath();
    ctx.strokeStyle = '#c0d4e8';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= canvas.width; x += CELL) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, SKY_HEIGHT);
    }
    for (let y = 0; y <= SKY_HEIGHT; y += CELL) {
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // Major grid lines — every 5 cells
    ctx.beginPath();
    ctx.strokeStyle = '#93b8d8';
    ctx.lineWidth = 1;
    for (let x = 0; x <= canvas.width; x += CELL * 5) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, SKY_HEIGHT);
    }
    for (let y = 0; y <= SKY_HEIGHT; y += CELL * 5) {
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();
  }

  function drawClouds() {
    // No clouds on grid paper
  }

  function drawPipe(p) {
    // Top gate
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topH);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, 0, 10, p.topH);
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.topH);

    // Bottom gate
    const botY = p.topH + PIPE_GAP;
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, botY, PIPE_WIDTH, SKY_HEIGHT - botY);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, botY, 10, SKY_HEIGHT - botY);
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, botY, PIPE_WIDTH, SKY_HEIGHT - botY);

    // Guide lines through the gap
    const midY = p.topH + PIPE_GAP / 2;
    const cx = p.x + PIPE_WIDTH / 2;
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);

    // Left edge line
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.topH);
    ctx.lineTo(p.x, botY);
    ctx.stroke();

    // Center line
    ctx.beginPath();
    ctx.moveTo(cx, p.topH);
    ctx.lineTo(cx, botY);
    ctx.stroke();

    // Right edge line
    ctx.beginPath();
    ctx.moveTo(p.x + PIPE_WIDTH, p.topH);
    ctx.lineTo(p.x + PIPE_WIDTH, botY);
    ctx.stroke();

    ctx.setLineDash([]);
    // Center tick mark
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 8, midY);
    ctx.lineTo(cx + 8, midY);
    ctx.stroke();
    ctx.restore();
  }

  function drawGround() {
    if (state === 'playing') {
      groundX -= PIPE_SPEED;
      if (groundX <= -20) groundX = 0;
    }

    ctx.fillStyle = '#00b894';
    ctx.fillRect(0, SKY_HEIGHT, canvas.width, GROUND_HEIGHT);

    ctx.fillStyle = '#00b894';
    for (let gx = groundX; gx < canvas.width; gx += 20) {
      ctx.fillRect(gx, SKY_HEIGHT, 12, 7);
    }
  }

  function drawScore() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2d3436';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 42px Arial';
    ctx.strokeText(score, canvas.width / 2, 70);
    ctx.fillText(score, canvas.width / 2, 70);
  }

  function drawOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 130, canvas.height / 2 - 140, 260, 280, 16);
    ctx.fill();

    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = '#fdcb6e';
      ctx.font = 'bold 38px Arial';
      ctx.fillText('SQUARE BIRD', canvas.width / 2, canvas.height / 2 - 70);
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillText('to start!', canvas.width / 2, canvas.height / 2 + 10);
    } else if (state === 'dead') {
      ctx.fillStyle = '#e17055';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 80);

      ctx.fillStyle = '#fff';
      ctx.font = '22px Arial';
      ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = '#fdcb6e';
      ctx.fillText('Best: ' + best, canvas.width / 2, canvas.height / 2 + 10);

      ctx.fillStyle = '#dfe6e9';
      ctx.font = '18px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 + 60);
      ctx.fillText('to play again', canvas.width / 2, canvas.height / 2 + 85);
    }
  }

  function spawnFlapDot() {
    flapCount++;
    flapDots.push({ x: bird.x, y: bird.y, n: flapCount });
    // Ghost B: launched from bird position, carries only current velocity (no gravity)
    velocityGhosts.push({ x: bird.x, y: bird.y, vy: JUMP });
    // Ghost C: spawns at bird position, falls with gravity only (no upward push)
    fallingGhosts.push({ x: bird.x, y: bird.y, vy: 0 });
  }

  function updateVelocityGhosts() {
    velocityGhosts.forEach(g => {
      g.y += g.vy; // velocity only — no gravity
    });
    velocityGhosts = velocityGhosts.filter(g => g.y > -SIZE && g.y < canvas.height);
  }

  function updateFallingGhosts() {
    fallingGhosts.forEach(g => {
      g.vy += GRAVITY; // gravity only — no jump velocity
      g.y += g.vy;
    });
    fallingGhosts = fallingGhosts.filter(g => g.y - SIZE / 2 < SKY_HEIGHT);
  }

  function drawGhostC() {
    const h = SIZE / 2;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    fallingGhosts.forEach(g => {
      ctx.strokeRect(g.x - h, g.y - h, SIZE, SIZE);
      ctx.fillStyle = '#a855f7';
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.arc(g.x, g.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.2;
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Ghost A: always at bird position, upright (no rotation)
  function drawGhostA() {
    const h = SIZE / 2;
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#e55039';
    ctx.lineWidth = 2;
    ctx.strokeRect(bird.x - h, bird.y - h, SIZE, SIZE);
    // Center dot
    ctx.fillStyle = '#e55039';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Ghost B: velocity-only launched boxes
  function drawGhostB() {
    const h = SIZE / 2;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    velocityGhosts.forEach(g => {
      ctx.strokeRect(g.x - h, g.y - h, SIZE, SIZE);
      // Center dot
      ctx.fillStyle = '#6c5ce7';
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.arc(g.x, g.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.2;
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function updateFlapDots() {}

  function drawFlapDots() {
    flapDots.forEach(d => {
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(d.x, d.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(d.n, d.x, d.y);
      ctx.textBaseline = 'alphabetic';
    });
  }

  function handleInput() {
    if (state === 'idle') {
      state = 'playing';
      frame = 0;
    } else if (state === 'playing') {
      bird.jump();
      spawnFlapDot();
    } else if (state === 'dead') {
      reset();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
    if (e.code === 'KeyP' && state === 'playing') {
      paused = !paused;
    }
  });
  canvas.addEventListener('click', handleInput);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });

  function reset() {
    bird.reset();
    pipes = [];
    flapDots = [];
    flapCount = 0;
    velocityGhosts = [];
    fallingGhosts = [];
    score = 0;
    frame = 0;
    state = 'playing';
  }

  function loop() {
    if (!paused) {
      frame++;
      bird.update();
      updateClouds();
      updateFlapDots();
      updateVelocityGhosts();
      updateFallingGhosts();

      if (state === 'playing') {
        updatePipes();

      pipes.forEach(p => {
        if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
          p.scored = true;
          score++;
          if (score > best) best = score;
        }
      });

      if (checkCollision()) state = 'dead';
    }
    } // end !paused

    drawSky();
    drawClouds();
    pipes.forEach(drawPipe);
    drawGround();
    drawFlapDots();
    drawGhostA();
    drawGhostB();
    drawGhostC();
    bird.draw();

    // Vertical line always following the bird — top to ground
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(bird.x, 0);
    ctx.lineTo(bird.x, SKY_HEIGHT);
    ctx.stroke();
    ctx.setLineDash([]);
    // Dot at top
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(bird.x, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    // Dot at ground
    ctx.beginPath();
    ctx.arc(bird.x, SKY_HEIGHT, 4, 0, Math.PI * 2);
    ctx.fill();
    // Horizontal line across bird's current Y
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, bird.y);
    ctx.lineTo(canvas.width, bird.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Paused label only when paused
    if (paused) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bird.x + 10, bird.y - 14, 58, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('PAUSED', bird.x + 14, bird.y + 1);
      ctx.restore();
    }

    if (state === 'playing') drawScore();
    if (state !== 'playing') drawOverlay();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
