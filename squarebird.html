<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
    }
    canvas {
      display: block;
      border: 3px solid #333;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  canvas.width = 360;
  canvas.height = 640;

  const GRAVITY = 0.45;
  const JUMP = -8.5;
  const PIPE_WIDTH = 60;
  const PIPE_GAP = 160;
  const PIPE_SPEED = 2.5;
  const PIPE_INTERVAL = 90;
  const GROUND_HEIGHT = 80;
  const SKY_HEIGHT = canvas.height - GROUND_HEIGHT;

  const SIZE = 28; // square side length

  let state = 'idle';
  let paused = false;
  let score = 0;
  let best = 0;
  let frame = 0;
  let flapDots = []; // { x, y, life, maxLife }

  const bird = {
    x: 80,
    y: canvas.height / 2 - 20,
    vy: 0,
    angle: 0,
    reset() {
      this.y = canvas.height / 2 - 20;
      this.vy = 0;
      this.angle = 0;
    },
    jump() {
      this.vy = JUMP;
    },
    update() {
      if (state === 'playing') {
        this.vy += GRAVITY;
        this.y += this.vy;
        this.angle = Math.min(Math.PI / 2, Math.max(-0.4, this.vy * 0.07));
      } else if (state === 'idle') {
        this.y = canvas.height / 2 - 20 + Math.sin(frame * 0.05) * 8;
      }
    },
    hitbox() {
      const h = SIZE * 0.8;
      return { x: this.x - h / 2, y: this.y - h / 2, w: h, h };
    },
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      const s = SIZE;
      const h = s / 2;

      // Body — yellow square
      ctx.fillStyle = '#f9ca24';
      ctx.fillRect(-h, -h, s, s);
      ctx.strokeStyle = '#e55039';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(-h, -h, s, s);

      // Wing — small orange rectangle on bottom-left side
      ctx.fillStyle = '#f0932b';
      ctx.fillRect(-h - 8, 2, 10, 8);
      ctx.strokeStyle = '#e55039';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-h - 8, 2, 10, 8);

      // Eye white — square eye
      ctx.fillStyle = '#fff';
      ctx.fillRect(4, -h + 4, 12, 12);

      // Pupil — small square
      ctx.fillStyle = '#130f40';
      ctx.fillRect(8, -h + 7, 6, 6);

      // Beak — triangle-ish using a rect poking out
      ctx.fillStyle = '#e55039';
      ctx.fillRect(h, -3, 8, 6);

      ctx.restore();
    }
  };

  let pipes = [];

  function spawnPipe() {
    const minTop = 80;
    const maxTop = SKY_HEIGHT - PIPE_GAP - 80;
    const topH = Math.random() * (maxTop - minTop) + minTop;
    pipes.push({ x: canvas.width, topH, scored: false });
  }

  function updatePipes() {
    if (frame % PIPE_INTERVAL === 0) spawnPipe();
    pipes.forEach(p => p.x -= PIPE_SPEED);
    pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
  }

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 90 + 30,
    y: 40 + Math.random() * 100,
    r: 20 + Math.random() * 20,
    speed: 0.3 + Math.random() * 0.3
  }));

  function updateClouds() {
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.r * 2 < 0) c.x = canvas.width + c.r;
    });
  }

  let groundX = 0;

  function checkCollision() {
    const hb = bird.hitbox();
    if (bird.y + SIZE / 2 >= SKY_HEIGHT || bird.y - SIZE / 2 <= 0) return true;
    for (const p of pipes) {
      if (hb.x < p.x + PIPE_WIDTH && hb.x + hb.w > p.x) {
        if (hb.y < p.topH || hb.y + hb.h > p.topH + PIPE_GAP) return true;
      }
    }
    return false;
  }

  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, SKY_HEIGHT);
    grad.addColorStop(0, '#74b9ff');
    grad.addColorStop(1, '#a29bfe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, SKY_HEIGHT);
  }

  function drawClouds() {
    // Square clouds to match the vibe
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    clouds.forEach(c => {
      ctx.fillRect(c.x - c.r, c.y - c.r * 0.6, c.r * 2, c.r * 1.2);
      ctx.fillRect(c.x - c.r * 0.6, c.y - c.r, c.r * 1.4, c.r * 0.8);
      ctx.fillRect(c.x + c.r * 0.3, c.y - c.r * 0.7, c.r * 1.1, c.r);
    });
  }

  function drawPipe(p) {
    // Top gate — flat square block, no cap
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topH);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, 0, 10, p.topH);

    // Bottom gate — flat square block, no cap
    const botY = p.topH + PIPE_GAP;
    ctx.fillStyle = '#00b894';
    ctx.fillRect(p.x, botY, PIPE_WIDTH, SKY_HEIGHT - botY);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(p.x + PIPE_WIDTH - 10, botY, 10, SKY_HEIGHT - botY);

    // Guide lines through the gap
    const midY = p.topH + PIPE_GAP / 2;
    const cx = p.x + PIPE_WIDTH / 2;
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);

    // Left edge line
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.topH);
    ctx.lineTo(p.x, botY);
    ctx.stroke();

    // Center line
    ctx.beginPath();
    ctx.moveTo(cx, p.topH);
    ctx.lineTo(cx, botY);
    ctx.stroke();

    // Right edge line
    ctx.beginPath();
    ctx.moveTo(p.x + PIPE_WIDTH, p.topH);
    ctx.lineTo(p.x + PIPE_WIDTH, botY);
    ctx.stroke();

    ctx.setLineDash([]);
    // Center tick mark
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 8, midY);
    ctx.lineTo(cx + 8, midY);
    ctx.stroke();
    ctx.restore();
  }

  function drawGround() {
    if (state === 'playing') {
      groundX -= PIPE_SPEED;
      if (groundX <= -20) groundX = 0;
    }

    const grad = ctx.createLinearGradient(0, SKY_HEIGHT, 0, canvas.height);
    grad.addColorStop(0, '#fdcb6e');
    grad.addColorStop(1, '#e17055');
    ctx.fillStyle = grad;
    ctx.fillRect(0, SKY_HEIGHT, canvas.width, GROUND_HEIGHT);

    ctx.fillStyle = '#55efc4';
    ctx.fillRect(0, SKY_HEIGHT, canvas.width, 14);

    ctx.fillStyle = '#00b894';
    for (let gx = groundX; gx < canvas.width; gx += 20) {
      ctx.fillRect(gx, SKY_HEIGHT, 12, 7);
    }
  }

  function drawScore() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 4;
    ctx.font = 'bold 42px Arial';
    ctx.strokeText(score, canvas.width / 2, 70);
    ctx.fillText(score, canvas.width / 2, 70);
  }

  function drawOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 130, canvas.height / 2 - 140, 260, 280, 16);
    ctx.fill();

    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = '#fdcb6e';
      ctx.font = 'bold 38px Arial';
      ctx.fillText('SQUARE BIRD', canvas.width / 2, canvas.height / 2 - 70);
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillText('to start!', canvas.width / 2, canvas.height / 2 + 10);
    } else if (state === 'dead') {
      ctx.fillStyle = '#e17055';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 80);

      ctx.fillStyle = '#fff';
      ctx.font = '22px Arial';
      ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = '#fdcb6e';
      ctx.fillText('Best: ' + best, canvas.width / 2, canvas.height / 2 + 10);

      ctx.fillStyle = '#dfe6e9';
      ctx.font = '18px Arial';
      ctx.fillText('Press SPACE or tap', canvas.width / 2, canvas.height / 2 + 60);
      ctx.fillText('to play again', canvas.width / 2, canvas.height / 2 + 85);
    }
  }

  function spawnFlapDot() {
    flapDots.push({ x: bird.x, y: bird.y });
  }

  function updateFlapDots() {}

  function drawFlapDots() {
    flapDots.forEach(d => {
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(d.x, d.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function handleInput() {
    if (state === 'idle') {
      state = 'playing';
      frame = 0;
    } else if (state === 'playing') {
      bird.jump();
      spawnFlapDot();
    } else if (state === 'dead') {
      reset();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
    if (e.code === 'KeyP' && state === 'playing') {
      paused = !paused;
    }
  });
  canvas.addEventListener('click', handleInput);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });

  function reset() {
    bird.reset();
    pipes = [];
    flapDots = [];
    score = 0;
    frame = 0;
    state = 'playing';
  }

  function loop() {
    if (!paused) {
      frame++;
      bird.update();
      updateClouds();
      updateFlapDots();

      if (state === 'playing') {
        updatePipes();

      pipes.forEach(p => {
        if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
          p.scored = true;
          score++;
          if (score > best) best = score;
        }
      });

      if (checkCollision()) state = 'dead';
    }
    } // end !paused

    drawSky();
    drawClouds();
    pipes.forEach(drawPipe);
    drawGround();
    drawFlapDots();
    bird.draw();

    // Drop line when paused
    if (paused) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(bird.x, bird.y);
      ctx.lineTo(bird.x, SKY_HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);
      // Dot at the landing point
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(bird.x, SKY_HEIGHT, 4, 0, Math.PI * 2);
      ctx.fill();
      // PAUSED label
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bird.x + 10, bird.y - 14, 58, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('PAUSED', bird.x + 14, bird.y + 1);
      ctx.restore();
    }

    if (state === 'playing') drawScore();
    if (state !== 'playing') drawOverlay();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
